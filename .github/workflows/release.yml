name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and main ancestry
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The release tag must point to a commit on main." >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  verify:
    name: Build (${{ matrix.os }}, Java 17)
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain clean check
      - name: Check (Linux)
        if: runner.os != 'Windows'
        run: sh ./gradlew --no-daemon --console=plain clean check

  package:
    name: Package release ZIP
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build ZIP after checks
        id: zip
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          sh ./gradlew --no-daemon --console=plain distZip "-PreleaseVersion=$RELEASE_VERSION"
          echo "archive=build/distributions/space-invaders-${RELEASE_VERSION}.zip" >> "$GITHUB_OUTPUT"
      - name: Keep release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: ${{ steps.zip.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: release
      - name: Publish verified archive and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          archive="release/space-invaders-${RELEASE_VERSION}.zip"
          test -s "$archive"
          (cd release && sha256sum "space-invaders-${RELEASE_VERSION}.zip" > "space-invaders-${RELEASE_VERSION}.zip.sha256")
          release_flags=()
          if [[ "$RELEASE_TAG" == *-rc* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${release_flags[@]}"
