name: Java 17 Gradle build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }}, Java 17)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain clean check
      - name: Check (Linux)
        if: runner.os != 'Windows'
        run: sh ./gradlew --no-daemon --console=plain clean check
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ runner.os }}-jdk17
          path: |
            build/reports/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7

  deliver:
    name: Package main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build ZIP after checks
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="main-${GITHUB_SHA:0:12}"
          sh ./gradlew --no-daemon --console=plain distZip "-PreleaseVersion=$version"
          echo "archive=build/distributions/space-invaders-${version}.zip" >> "$GITHUB_OUTPUT"
      - name: Upload playable build
        uses: actions/upload-artifact@v7
        with:
          name: main-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
